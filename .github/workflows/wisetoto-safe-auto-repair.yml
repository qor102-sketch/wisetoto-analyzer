name: Wisetoto OOS free review and manual repair kit
on:
  workflow_run:
    workflows: ["Wisetoto auto PRE and postmatch verification"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful main-branch auto-audit run ID with artifact"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: read
  checks: read
  deployments: read

concurrency:
  group: wisetoto-safe-repair
  cancel-in-progress: false

jobs:
  diagnose-and-draft:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted default-branch repair policy
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Restore frozen PRE and OOS audit from successful run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
        run: |
          mkdir -p automation-state
          echo "source_run=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then exit 1; fi
          if gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            -n wisetoto-auto-state -D automation-state; then
            if [ -s automation-state/state.json ] && [ -s automation-state/audit.json ]; then
              echo "has_artifact=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "No completed frozen tracker artifact; no repair." >> "$GITHUB_STEP_SUMMARY"
          echo "has_artifact=false" >> "$GITHUB_OUTPUT"
      - name: Independent postmatch cause analysis
        if: steps.source.outputs.has_artifact == 'true'
        id: triage
        run: |
          node automation/repair/triage.mjs
          cat automation-state/repair-triage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Explain frozen PRE vs result without paid AI
        if: steps.source.outputs.has_artifact == 'true'
        run: |
          node automation/repair/explain.mjs
          cat automation-state/repair-ai-analysis.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build free Korean manual repair package for confirmed investigation needs
        if: steps.source.outputs.has_artifact == 'true'
        id: manual
        env:
          SOURCE_AUDIT_RUN: ${{ steps.source.outputs.source_run }}
        run: |
          node automation/repair/manual-kit.mjs
          cat automation-state/manual-kit-status.json >> "$GITHUB_STEP_SUMMARY"

      - name: Open deduplicated repair review issues with download instructions
        if: steps.manual.outputs.has_cases == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_AUDIT_RUN: ${{ steps.source.outputs.source_run }}
        run: node automation/repair/issues.mjs

      - name: Upload downloadable manual fix kit (no AI API required)
        if: steps.manual.outputs.has_cases == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wisetoto-manual-fix-kit
          path: automation-state/manual-fix-kit/
          retention-days: 90
          if-no-files-found: error
      - name: Retain transparent diagnosis, patch and Preview evidence
        if: always() && steps.source.outputs.has_artifact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wisetoto-free-oos-audit
          path: |
            automation-state/repair-triage.json
            automation-state/repair-triage.md
            automation-state/repair-ai-analysis.md
            automation-state/repair-analysis.json
            automation-state/manual-kit-status.json
          retention-days: 90
          if-no-files-found: warn
