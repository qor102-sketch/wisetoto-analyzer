name: Read-only API-Football key and fixture verification
on:
  push:
    branches: [feat/official-sources-no-naver-20261121]
    paths: [".github/workflows/api-football-key-smoke.yml"]
permissions:
  contents: read
jobs:
  verify-key:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - name: Verify secret, free plan and one real fixture listing without logging credentials
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const key=String(process.env.API_FOOTBALL_KEY??"").trim();
          if(key.length<12){
            console.error("API_FOOTBALL_AUTH_CHECK {status:'MISSING_KEY'}");
            process.exit(1);
          }
          const headers={"x-apisports-key":key,accept:"application/json"};
          async function query(url){
            const response=await fetch(url,{headers,signal:AbortSignal.timeout(10000)});
            const payload=await response.json().catch(()=>null);
            const errs=payload?.errors;
            if(!response.ok||(errs&&Object.keys(errs).length)){
              console.error("API_FOOTBALL_SOURCE_CHECK "+JSON.stringify({
                ok:false,http:response.status,hasErrors:Boolean(errs&&Object.keys(errs).length)
              }));
              process.exit(1);
            }
            return payload;
          }
          const status=await query("https://v3.football.api-sports.io/status");
          const limits=status?.response?.requests;
          const plan=status?.response?.subscription?.plan;
          if(!limits||!Number.isFinite(Number(limits.limit_day))){
            console.error("API_FOOTBALL_AUTH_CHECK {status:'UNEXPECTED_SCHEMA'}");
            process.exit(1);
          }
          console.log("API_FOOTBALL_AUTH_CHECK "+JSON.stringify({
            authenticated:true,freePlan:/free/i.test(String(plan)),
            dailyLimit:Number(limits.limit_day),
            dailyUsed:Number(limits.current||0)
          }));
          // One read-only sample: this checks real 2026 fixtures, not just auth.
          const date="2026-11-20";
          const data=await query("https://v3.football.api-sports.io/fixtures?"+
            new URLSearchParams({date,timezone:"UTC"}));
          const rows=data?.response;
          if(!Array.isArray(rows)){
            console.error("API_FOOTBALL_FIXTURE_CHECK {status:'UNEXPECTED_SCHEMA'}");
            process.exit(1);
          }
          const count=rows.filter(x=>Number.isSafeInteger(x?.fixture?.id)&&
            typeof x?.fixture?.date==="string").length;
          console.log("API_FOOTBALL_FIXTURE_CHECK "+JSON.stringify({
            authenticated:true,date,fixtureRows:rows.length,validFixtureIds:count,
            coverageObserved:count>0,
            epl:rows.filter(x=>x?.league?.name==="Premier League"&&x?.league?.country==="England").length,
            j1:rows.filter(x=>x?.league?.name==="J1 League"&&x?.league?.country==="Japan").length,
            j2:rows.filter(x=>x?.league?.name==="J2 League"&&x?.league?.country==="Japan").length
          }));
          if(count===0)process.exitCode=2;
          NODE
