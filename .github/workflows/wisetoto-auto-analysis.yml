name: Wisetoto auto PRE and postmatch verification
on:
  schedule:
    # Six scans an hour, UTC; GitHub schedule is best-effort and may be delayed.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/wisetoto-auto-analysis.yml"

permissions:
  contents: write  # publish projected data to automation-data branch
  actions: write  # self-dispatch recovery when GitHub drops scheduled events
  issues: write

concurrency:
  group: wisetoto-automatic-pre-post-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run immutable-record unit tests
        run: node --test automation/*.test.mjs automation/repair/*.test.mjs automation/research/*.test.mjs
      - name: Install app and browser
        run: |
          cd WisetotoAnalyzer-LiveFree && npm install --no-audit --no-fund
          cd .. && npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Compile and typecheck Next.js production build (Preview quota fallback)
        run: |
          cd WisetotoAnalyzer-LiveFree
          npm run build
      - name: Launch Next.js browser test server
        run: |
          cd WisetotoAnalyzer-LiveFree
          npm run dev -- -p 3100 -H 127.0.0.1 > /tmp/wisetoto-dev.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3100/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/wisetoto-dev.log
          exit 1
      - name: Verify automation bridge without fabricated game
        run: node automation/smoke.mjs

  auto-audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Restore latest automation state artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p automation-state
          artifact_id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=wisetoto-auto-state&per_page=15" --jq '.artifacts | map(select(.expired == false)) | .[0].id // empty' || true)"
          if [ -n "$artifact_id" ]; then
            if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              -o /tmp/wisetoto-auto-state.zip; then
              unzip -oq /tmp/wisetoto-auto-state.zip -d automation-state
            fi
          fi
      - name: Restore persistent pregame market evidence
        # GitHub automation-data holds durable odds snapshots; no paid database.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "/repos/$GITHUB_REPOSITORY/contents/research-state.json.gz?ref=automation-data" \
              > /tmp/wisetoto-evidence-ref.json 2>/dev/null; then
            jq -r '.content' /tmp/wisetoto-evidence-ref.json | base64 -d > /tmp/wisetoto-evidence-state.json.gz
            gzip -dc /tmp/wisetoto-evidence-state.json.gz > automation-state/research-state.json
          fi
      - name: Restore 30-minute collection ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "/repos/$GITHUB_REPOSITORY/contents/collect-first-state.json.gz?ref=automation-data" > /tmp/collect-ledger-ref.json 2>/dev/null; then
            jq -r '.content' /tmp/collect-ledger-ref.json | base64 -d | gzip -dc > automation-state/collect-first-state.json
          fi
      - name: Due match and verification preflight
        id: due
        run: node automation/runner.mjs --preflight
      - name: Seed no-deploy config on automation-data branch
        # Vercel reads vercel.json FROM THE DATA BRANCH itself.
        # Existing minimal configs must also be updated, not skipped.
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in "WisetotoAnalyzer-LiveFree/vercel.json" "WisetotoAnalyzer-LiveFree/WisetotoAnalyzer-LiveFree/vercel.json"; do
            current_sha=""
            if gh api "/repos/$GITHUB_REPOSITORY/contents/$f?ref=automation-data" > /tmp/data-vercel-config.json 2>/dev/null; then
              current_sha="$(jq -r '.sha' /tmp/data-vercel-config.json)"
              current_json="$(jq -r '.content' /tmp/data-vercel-config.json | base64 -d)"
              if printf '%s' "$current_json" | jq -e '.git.deploymentEnabled["automation-data"] == false' > /dev/null; then
                continue
              fi
              updated_json="$(printf '%s' "$current_json" | jq -c '.git.deploymentEnabled["automation-data"] = false')"
            else
              updated_json='{"framework":"nextjs","git":{"deploymentEnabled":{"automation-data":false}}}'
            fi
            encoded="$(printf '%s' "$updated_json" | base64 -w0)"
            if [ -n "$current_sha" ]; then
              gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/$f" \
                -f branch="automation-data" -f message="Disable Vercel deploys for data-only branch" \
                -f sha="$current_sha" -f content="$encoded" >/dev/null
            else
              gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/$f" \
                -f branch="automation-data" -f message="Disable Vercel deploys for data-only branch" \
                -f content="$encoded" >/dev/null
            fi
          done
      - name: Capture 30-minute fixtures and reconcile verified results without browser
        if: always()
        env:
          WISETOTO_URL: https://wisetoto-analyzer.vercel.app
        run: node automation/research/run-collect-first.mjs
      - name: Persist collection-first ledger and public status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s automation-state/collect-first-state.json ]; then exit 0; fi
          gzip -cn automation-state/collect-first-state.json > /tmp/collect-first-state.json.gz
          for remote_file in collect-first-state.json.gz collect-first-public.json; do
            if [ "$remote_file" = "collect-first-state.json.gz" ]; then
              file=/tmp/collect-first-state.json.gz
            else
              file=automation-state/collect-first-public.json
            fi
            content="$(base64 -w0 "$file")"
            sha="$(gh api "/repos/$GITHUB_REPOSITORY/contents/$remote_file?ref=automation-data" --jq .sha 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/$remote_file" \
                -f branch="automation-data" -f message="Collect-first 30min fixtures and confirmed results" \
                -f sha="$sha" -f content="$content" >/dev/null
            else
              gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/$remote_file" \
                -f branch="automation-data" -f message="Initialize collect-first ledger" \
                -f content="$content" >/dev/null
            fi
          done
      - name: Collect longitudinal prekickoff evidence without Chromium
        # Separate observational lane: starts even if a previous/main PRE failed.
        if: always()
        run: node automation/research/run.mjs
      - name: Publish evidence archive and experimental read-only candidates
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s automation-state/research-public.json ]; then exit 0; fi
          # Preserve the full 120-day research sample while staying well below
          # GitHub Contents API's 1 MiB inline-content limit.
          gzip -cn automation-state/research-state.json > /tmp/research-state.json.gz
          for remote_file in "research-state.json.gz" "research-public.json"; do
            if [ "$remote_file" = "research-state.json.gz" ]; then
              local_file="/tmp/research-state.json.gz"
            else
              local_file="automation-state/research-public.json"
            fi
            content="$(base64 -w 0 "$local_file")"
            sha="$(gh api "/repos/$GITHUB_REPOSITORY/contents/$remote_file?ref=automation-data" --jq .sha 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/$remote_file" \
                -f branch="automation-data" -f message="Prekickoff evidence observation" \
                -f sha="$sha" -f content="$content" >/dev/null
            else
              gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/$remote_file" \
                -f branch="automation-data" -f message="Initialize prekickoff evidence archive" \
                -f content="$content" >/dev/null
            fi
          done
      - name: Publish transparent scan health even if Betman is down
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s automation-state/scan-health.json ]; then exit 0; fi
          encoded="$(base64 -w 0 automation-state/scan-health.json)"
          current="$(gh api "/repos/$GITHUB_REPOSITORY/contents/automation-health.json?ref=automation-data" --jq .sha 2>/dev/null || true)"
          if [ -n "$current" ]; then
            gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/automation-health.json" \
              -f branch="automation-data" -f message="Scan health heartbeat" \
              -f sha="$current" -f content="$encoded" >/dev/null
          else
            gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/automation-health.json" \
              -f branch="automation-data" -f message="Initialize scan health heartbeat" \
              -f content="$encoded" >/dev/null
          fi
      - name: Install browser only when work is due
        if: always() && steps.due.outputs.run_browser == 'true'
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Run exact production model and verify results
        if: steps.due.outputs.pregame_due == 'true'
        env:
          WISETOTO_URL: https://wisetoto-analyzer.vercel.app
        run: node automation/runner.mjs
      - name: Reconcile ended games independently of PRE batch outcome
        if: always() && steps.due.outputs.verify_due == 'true'
        env:
          WISETOTO_URL: https://wisetoto-analyzer.vercel.app
        run: |
          if [ -s automation-state/state.json ]; then node automation/runner.mjs --verify-only; fi
      - name: Generate public read-only dashboard projection
        if: always() && steps.due.outputs.run_browser == 'true'
        run: |
          if [ -s automation-state/state.json ] && [ -s automation-state/checkpoint-ready ]; then node automation/publish.mjs; fi
      - name: Publish site-readable history (no browser secrets)
        if: always() && steps.due.outputs.run_browser == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s automation-state/public-history.json ] || [ ! -s automation-state/checkpoint-ready ]; then exit 0; fi
          encoded="$(base64 -w 0 automation-state/public-history.json)"
          current_sha="$(gh api "/repos/$GITHUB_REPOSITORY/contents/automation-history.json?ref=automation-data" --jq .sha)"
          gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/automation-history.json" \
            -f message="Update read-only automation dashboard data" \
            -f branch="automation-data" \
            -f sha="$current_sha" \
            -f content="$encoded" > /dev/null
      - name: Summarize OOS report
        if: steps.due.outputs.run_browser == 'true'
        run: cat automation-state/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open review issue for source/grade problems
        if: steps.due.outputs.run_browser == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s automation-state/review.md ]; then
            title="$(cat automation-state/review-title.txt)"
            issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --json title,number \
              --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
            if [ -z "$issue" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file automation-state/review.md
            fi
          fi
      - name: Archive frozen tracker and OOS report
        if: always() && steps.due.outputs.run_browser == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wisetoto-auto-state
          path: |
            automation-state/state.json
            automation-state/audit.json
            automation-state/report.md
            automation-state/public-history.json
          retention-days: 90
          if-no-files-found: error

  scan-heartbeat:
    # GitHub schedule can be dropped; GITHUB_TOKEN workflow_dispatch chains
    # the next run at approximately 10-minute intervals. No PR dispatch.
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: [auto-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Queue next scan unless a newer main run exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: node automation/chain.mjs
